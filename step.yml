title: MobSF Scan
summary: Internal step.
description: Internal step. Not supported for outside use.
website: https://github.com/patrontech/bitrise-step-mobsf-scan
source_code_url: https://github.com/patrontech/bitrise-step-mobsf-scan

type_tags:
  - utility

toolkit:
  bash:
    entry_file: step.sh

inputs:
  - target_path:
    opts:
      title: Target
      is_required: true
      is_expand: true
  - platform:
    opts:
      title: Platform
      is_expand: true
  - report_prefix: MobSF
    opts:
      title: Prefix
      is_expand: true
  - mobsf_image: opensecurity/mobile-security-framework-mobsf:v4.5.3
    opts:
      title: Image
      is_expand: true
  - output_dir:
    opts:
      title: Output directory
      is_expand: true
  - startup_timeout: "600"
    opts:
      title: Startup timeout
      is_expand: true
  - scan_timeout: "3600"
    opts:
      title: Scan timeout
      is_expand: true

outputs:
  - MOBSF_OUTPUT_DIR:
  - MOBSF_PDF_PATH:
  - MOBSF_JSON_PATH:
  - MOBSF_SCORECARD_PATH:
  - MOBSF_APP_NAME:
  - MOBSF_APP_VERSION:
  - MOBSF_APP_BUILD:
  - MOBSF_SECURITY_SCORE:
  - MOBSF_VERSION:
